name: Desktop smoke tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    defaults:
      run:
        working-directory: SpamCheck Desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: SpamCheck Desktop
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install dependencies and test the desktop
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_python=.venv/Scripts/python.exe
          else
            venv_python=.venv/bin/python
          fi
          "./$venv_python" -m pip install --only-binary=:all: -r requirements.txt
          npm --prefix electron ci
      - name: Verify first launch with slow model startup
        run: |
          bridge_backup="$RUNNER_TEMP/spamcheck-bridge.py"
          cp electron/bridge.py "$bridge_backup"
          trap 'cp "$bridge_backup" electron/bridge.py' EXIT
          {
            printf 'from time import sleep\nsleep(23)\n'
            cat "$bridge_backup"
          } > electron/bridge.py
          SPAMCHECK_SMOKE_EXPECT_LOADING=1 npm --prefix electron start -- --smoke
      - name: Verify model switching in the running worker
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_python=.venv/Scripts/python.exe
          else
            venv_python=.venv/bin/python
          fi
          "./$venv_python" tests/desktop_models.py
